<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHARM Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    background:#1f2937;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
    text-align:center;
}

.value{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}
</style>

</head>
<body>

<h1>🛠 SHARM Admin Panel</h1>

<div class="card">
    <h2>👥 Total Users</h2>
    <div class="value" id="totalUsers">0</div>
</div>

<div class="card">
    <h2>💰 Total Balance</h2>
    <div class="value" id="totalBalance">0</div>
</div>

<div class="card">
    <h2>🆕 Today's Users</h2>
    <div class="value" id="todayUsers">0</div>
</div>
<div class="card">

    <h2>⚙️ App Settings</h2>

    <label>Referral Bonus</label><br>
    <input id="referral_bonus"><br><br>

    <label>Daily Reward</label><br>
    <input id="daily_reward"><br><br>

    <label>YouTube Link</label><br>
    <input id="youtube_link"><br><br>

    <label>YouTube Reward</label><br>
    <input id="youtube_reward"><br><br>

    <label>Facebook Link</label><br>
    <input id="facebook_link"><br><br>

    <label>Facebook Reward</label><br>
    <input id="facebook_reward"><br><br>

    <label>Telegram Link</label><br>
    <input id="telegram_link"><br><br>

    <label>Telegram Reward</label><br>
    <input id="telegram_reward"><br><br>

    <label>TikTok Link</label><br>
    <input id="tiktok_link"><br><br>

    <label>TikTok Reward</label><br>
    <input id="tiktok_reward"><br><br>

    <label>X (Twitter) Link</label><br>
    <input id="x_link"><br><br>

    <label>X Reward</label><br>
    <input id="x_reward"><br><br>

    <label>Airdrop Status</label><br>
    <select id="airdrop_status">
        <option value="coming_soon">Coming Soon</option>
        <option value="live">Live</option>
        <option value="ended">Ended</option>
    </select><br><br>

    <button onclick="saveSettings()">
        💾 Save Settings
    </button>

</div>
    <div class="card">

    <h2>👥 Users</h2>

    <table id="usersTable" border="1" width="100%">
        <thead>
            <tr>
                <th>Telegram ID</th>
                <th>Username</th>
                <th>Name</th>
                <th>Balance</th>
                <th>Energy</th>
            </tr>
        </thead>

        <tbody id="usersTableBody">
            <!-- Users will appear here -->
        </tbody>

    </table>

</div>

<script>

const API_URL = "https://sharm-backend-5547.onrender.com";


async function loadSettings() {

    const res = await fetch(`${API_URL}/api/admin/settings`);
    const data = await res.json();

    if (!data.success) return;

    const s = data.settings;

    for (const key in s) {

        const el = document.getElementById(key);

        if (el) {
            el.value = s[key];
        }

    }
}


async function saveSettings() {

    const keys = [
        "referral_bonus",
        "daily_reward",
        "youtube_link",
        "youtube_reward",
        "facebook_link",
        "facebook_reward",
        "telegram_link",
        "telegram_reward",
        "tiktok_link",
        "tiktok_reward",
        "x_link",
        "x_reward",
        "airdrop_status"
    ];

    for (const key of keys) {

        await fetch(`${API_URL}/api/admin/settings`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                setting_key: key,
                setting_value:
                    document.getElementById(key).value
            })

        });

    }

    alert("✅ Settings Saved Successfully");

}


async function loadStats() {

    try {

        const res =
            await fetch(`${API_URL}/api/admin/stats`);

        const data = await res.json();

        if (data.success) {

            document.getElementById("totalUsers").innerText =
                data.total_users;

            document.getElementById("totalBalance").innerText =
                data.total_balance;

            document.getElementById("todayUsers").innerText =
                data.today_users;

        }

    } catch (err) {

        console.log(err);

    }

}


/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

    try {

        const res =
            await fetch(`${API_URL}/api/admin/users`);

        const data = await res.json();

        if (!data.success) {
            console.log("Users API error:", data);
            return;
        }

        const tbody =
            document.getElementById("usersTableBody");

        tbody.innerHTML = "";

        data.users.forEach(user => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${user.telegram_id ?? ""}</td>
                <td>${user.username ?? ""}</td>
                <td>${user.first_name ?? ""}</td>
                <td>${user.balance ?? 0}</td>
                <td>${user.energy ?? 0}</td>
            `;

            tbody.appendChild(row);

        });

    } catch (err) {

        console.error("Users loading error:", err);

    }

}


/* =========================
   START
========================= */

loadSettings();
loadStats();
loadUsers();

</script>

</body>
</html>
